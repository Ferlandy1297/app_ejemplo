services:
  # 1. Base de datos PostgreSQL 16
  db:
    image: postgres:16-alpine
    container_name: ferreteria_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ferreteria_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ferreteria_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ferreteria_net

  # 2. Backend Spring Boot 3 + Java 21 + Liquibase + JWT
  backend:
    build:
      context: ./app_ejemplo_backend
      dockerfile: Dockerfile
    container_name: ferreteria_backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ferreteria_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env}
      JWT_EXPIRATION: 60000
      JWT_REFRESH_EXPIRATION: 86400000
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:?Define DEMO_ADMIN_EMAIL en el archivo .env}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Define DEMO_ADMIN_PASSWORD en el archivo .env}
      DEMO_OPERATOR_EMAIL: ${DEMO_OPERATOR_EMAIL:?Define DEMO_OPERATOR_EMAIL en el archivo .env}
      DEMO_OPERATOR_PASSWORD: ${DEMO_OPERATOR_PASSWORD:?Define DEMO_OPERATOR_PASSWORD en el archivo .env}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ferreteria_net

  # 3. Frontend Next.js 14
  frontend:
    build:
      context: ./app_ejemplo
      dockerfile: Dockerfile
    container_name: ferreteria_frontend
    restart: unless-stopped
    environment:
      BACKEND_API_URL: http://backend:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ferreteria_net

volumes:
  postgres_data:
    driver: local

networks:
  ferreteria_net:
    driver: bridge
